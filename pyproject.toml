[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "cpv301-autodrive"
version = "0.1.0"
description = "Local product scaffold for GTSRB traffic-sign recognition and autonomous-driving simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "h5py>=3.16,<4",
  "numpy==2.1.3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.50,<2",
  "tensorflow==2.20.0",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "ipykernel>=6.30,<8",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<4",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
  "wget>=3.2,<4",
]

[project.scripts]
cpv301 = "cpv301_autodrive.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks", "data", "results"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
