[project]
name = "cpv301-detector"
version = "0.1.0"
description = "M1/M4 Vietnamese traffic-sign detector training package (separate env: Ultralytics needs numpy >2.3.4 on macOS; the root env pins numpy 2.1.3 for TensorFlow E0)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ultralytics==8.4.172",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
